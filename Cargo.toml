[package]
name = "skald"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
aes = "0.8"
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
cbc = "0.1"
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
gst = { version = "0.25", package = "gstreamer" }
gst_play = { version = "0.25", package = "gstreamer-play" }
gtk4 = { version = "0.11", features = ["v4_18"] }
# The omarchy-mobile app kit (pages, the action row, the app menu, back, the
# theme): kit/ links to its crates while developing, and the source package
# carries a copy (packaging/make-source.sh).
omarchy-mobile = { path = "kit/omarchy-mobile" }
hex = "0.4.3"
mpris-server = "0.10.0"
# The sign-in in the keyring (the Secret portal under omarchy-mobile's sandbox).
oo7 = "0.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "cookies", "stream"] }
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webkit6 = "0.6"
